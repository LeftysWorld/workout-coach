# Every exercise the coach may suggest, with what it trains and what it needs. A swap or an added
# exercise must come from this list (the governor checks), so add to it when you find one you like.
# pattern: a movement family. Swaps stay within a family unless a change says why.
# equipment: must all be in profile/athlete.yaml → equipment.
# knee: none | low (sitting or lying, feet planted, no knee bend under load) | loads (out while the knee rule stands)
# cables: how many cable stacks it needs at once.

exercises:
  # ---------- Vertical pull (lats) ----------
  - { name: Lat Pulldown, pattern: vertical_pull, muscles: [lats, biceps, upper_back], equipment: [lat_pulldown], knee: low, cables: 1, step: machine }
  - { name: Wide-Grip Lat Pulldown, pattern: vertical_pull, muscles: [lats, upper_back], equipment: [lat_pulldown], knee: low, cables: 1, step: machine }
  - { name: Close-Grip Lat Pulldown, pattern: vertical_pull, muscles: [lats, biceps], equipment: [lat_pulldown], knee: low, cables: 1, step: machine }
  - { name: Single-Arm Cable Pulldown, pattern: vertical_pull, muscles: [lats], equipment: [single_cable], knee: none, cables: 1, step: cable }
  - { name: Straight-Arm Cable Pulldown, pattern: lat_isolation, muscles: [lats], equipment: [single_cable], knee: none, cables: 1, step: cable }
  - { name: Dumbbell Pullover, pattern: lat_isolation, muscles: [lats, chest], equipment: [dumbbells, adjustable_bench], knee: none, cables: 0, step: dumbbell }

  # ---------- Horizontal pull (back) ----------
  - { name: Seated Cable Row, pattern: horizontal_pull, muscles: [upper_back, lats, biceps], equipment: [seated_cable_row], knee: low, cables: 1, step: machine }
  - { name: Chest-Supported DB Row, pattern: horizontal_pull, muscles: [upper_back, lats, rear_delts], equipment: [dumbbells, incline_bench], knee: none, cables: 0, step: dumbbell }
  - { name: Single-Arm DB Row, pattern: horizontal_pull, muscles: [lats, upper_back], equipment: [dumbbells, adjustable_bench], knee: none, cables: 0, step: dumbbell }
  - { name: Seal Row (DB, flat bench), pattern: horizontal_pull, muscles: [upper_back, lats], equipment: [dumbbells, adjustable_bench], knee: none, cables: 0, step: dumbbell }

  # ---------- Horizontal push (chest) ----------
  - { name: Flat DB Bench Press, pattern: horizontal_push, muscles: [chest, triceps, front_delts], equipment: [dumbbells, adjustable_bench], knee: low, cables: 0, step: dumbbell }
  - { name: Incline DB Press, pattern: incline_push, muscles: [upper_chest, front_delts, triceps], equipment: [dumbbells, incline_bench], knee: low, cables: 0, step: dumbbell }
  - { name: Machine Chest Press, pattern: horizontal_push, muscles: [chest, triceps], equipment: [chest_press_machine], knee: low, cables: 0, step: machine }
  - { name: Low-Incline DB Fly, pattern: chest_isolation, muscles: [chest], equipment: [dumbbells, incline_bench], knee: low, cables: 0, step: dumbbell }
  - { name: Flat DB Fly, pattern: chest_isolation, muscles: [chest], equipment: [dumbbells, adjustable_bench], knee: low, cables: 0, step: dumbbell }
  - { name: Single-Arm Cable Fly, pattern: chest_isolation, muscles: [chest], equipment: [single_cable], knee: none, cables: 1, step: cable }

  # ---------- Vertical push (shoulders) ----------
  - { name: Seated DB Shoulder Press, pattern: vertical_push, muscles: [front_delts, side_delts, triceps], equipment: [dumbbells, adjustable_bench], knee: none, cables: 0, step: dumbbell }
  - { name: Seated DB Arnold Press, pattern: vertical_push, muscles: [front_delts, side_delts, triceps], equipment: [dumbbells, adjustable_bench], knee: none, cables: 0, step: dumbbell }

  # ---------- Shoulder isolation ----------
  - { name: Seated Lateral Raise, pattern: lateral_raise, muscles: [side_delts], equipment: [dumbbells, adjustable_bench], knee: none, cables: 0, step: dumbbell }
  - { name: Cable Lateral Raise, pattern: lateral_raise, muscles: [side_delts], equipment: [single_cable], knee: none, cables: 1, step: cable }
  - { name: Lean-Away DB Lateral Raise, pattern: lateral_raise, muscles: [side_delts], equipment: [dumbbells], knee: none, cables: 0, step: dumbbell }
  - { name: Seated Rear-Delt Fly, pattern: rear_delt, muscles: [rear_delts, upper_back], equipment: [dumbbells, incline_bench], knee: none, cables: 0, step: dumbbell }
  - { name: Reverse Pec Deck, pattern: rear_delt, muscles: [rear_delts, upper_back], equipment: [rear_delt_machine], knee: low, cables: 0, step: machine }
  - { name: Cable Face Pull, pattern: rear_delt, muscles: [rear_delts, upper_back], equipment: [single_cable], knee: none, cables: 1, step: cable }

  # ---------- Arms ----------
  - { name: Seated DB Curl, pattern: elbow_flexion, muscles: [biceps], equipment: [dumbbells, adjustable_bench], knee: none, cables: 0, step: dumbbell }
  - { name: Seated Incline DB Curl, pattern: elbow_flexion, muscles: [biceps], equipment: [dumbbells, incline_bench], knee: none, cables: 0, step: dumbbell }
  - { name: Seated Hammer Curl, pattern: elbow_flexion, muscles: [biceps, forearms], equipment: [dumbbells, adjustable_bench], knee: none, cables: 0, step: dumbbell }
  - { name: Cable Curl, pattern: elbow_flexion, muscles: [biceps], equipment: [single_cable], knee: none, cables: 1, step: cable }
  - { name: Cable Triceps Pushdown, pattern: elbow_extension, muscles: [triceps], equipment: [single_cable], knee: none, cables: 1, step: cable }
  - { name: Overhead Cable Triceps Extension, pattern: elbow_extension, muscles: [triceps], equipment: [single_cable], knee: none, cables: 1, step: cable }
  - { name: Seated Overhead Triceps Extension, pattern: elbow_extension, muscles: [triceps], equipment: [dumbbells, adjustable_bench], knee: none, cables: 0, step: dumbbell }
  - { name: "Arm Superset: Cable Curl + Overhead Cable Triceps Extension", pattern: arm_superset, muscles: [biceps, triceps], equipment: [single_cable], knee: none, cables: 1, step: cable }

  # ---------- Lower back and core (knee-safe only) ----------
  - { name: Hammer Strength Back Extension, pattern: hip_extension_back, muscles: [lower_back, glutes], equipment: [hammer_strength_back_extension], knee: low, cables: 0, step: machine }
  - { name: Hammer Strength Glute/Ham Hip Extension (knee test), pattern: hip_extension_back, muscles: [lower_back, glutes, hamstrings], equipment: [hammer_strength_glute_ham], knee: low, cables: 0, step: machine, trial: true }
  - { name: Sit-Up Bench Crunch (knee test), pattern: core_flexion, muscles: [abs], equipment: [sit_up_bench], knee: low, cables: 0, step: none, trial: true }

  # ---------- Never (listed so the governor names them when proposed) ----------
  - { name: Cable Fly (two cables), pattern: chest_isolation, muscles: [chest], equipment: [single_cable], knee: none, cables: 2, step: cable }
  - { name: Goblet Squat, pattern: squat, muscles: [quads, glutes], equipment: [dumbbells], knee: loads, cables: 0, step: dumbbell }
  - { name: Romanian Deadlift (DB), pattern: deadlift, muscles: [hamstrings, glutes, lower_back], equipment: [dumbbells], knee: loads, cables: 0, step: dumbbell }
