name: Weekly review

on:
  schedule:
    # Saturday 04:00 UTC = Friday 11 pm Eastern (midnight in summer): after Friday's workout.
    - cron: "0 4 * * 6"
  workflow_dispatch:
    inputs:
      as_of:
        description: "Review the week ending on this date (YYYY-MM-DD). Empty = today."
        required: false
      publish:
        description: "Save the report to the app"
        type: boolean
        default: false

concurrency:
  group: weekly-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WORKOUT_AGENT_URL: ${{ secrets.WORKOUT_AGENT_URL }}
      WORKOUT_AGENT_KEY: ${{ secrets.WORKOUT_AGENT_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_TRACING: ${{ secrets.LANGSMITH_API_KEY && 'true' || 'false' }}
      LANGSMITH_PROJECT: workout-coach
      # Off until you set the repository variable COACH_PUBLISH to true (Settings → Variables).
      COACH_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && 'true' || vars.COACH_PUBLISH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Review the week
        # The as-of date, when given, travels as an environment variable rather than inside the command.
        env:
          AS_OF: ${{ inputs.as_of }}
        run: coach run ${AS_OF:+--as-of "$AS_OF"}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coach-report
          path: out/
          if-no-files-found: ignore
