name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Unit tests and the pipeline with the scripted rules
        run: pytest -q
      - name: Every scenario, scripted rules
        run: coach evals --scripted

  evals:
    # The real agents, only when prompts, skills, the profile or the reward change, and only when the key is set.
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_TRACING: ${{ secrets.LANGSMITH_API_KEY && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - id: changed
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qE '^(agents|skills|profile)/|^coach/(score|agents|prompts|flow|governor)\.py'; then echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.changed.outputs.run == 'true' && env.ANTHROPIC_API_KEY != ''
        run: |
          pip install -e ".[dev]"
          coach evals --repeats 3 ${{ env.LANGSMITH_API_KEY != '' && '--langsmith' || '' }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals
          path: out/
          if-no-files-found: ignore
